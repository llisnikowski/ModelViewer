repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v2.3.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
        exclude: libs/glad/
      - id: trailing-whitespace
        exclude: libs/glad/
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v18.1.5
    hooks:
      - id: clang-format
        style: file
        types_or: [c++, c]
        exclude: libs/glad/
